<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninho — Direção 3 · Faixas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F2; --surface:#fff; --surface-2:#F4F5F7; --line:#DFE2E6; --ink:#101317; --ink-2:#4B525C; --ink-3:#848B95;
  --accent:#101317;
  --m1:#E2552F; --m2:#14946F; --m3:#E0A100; --m4:#2F6BE0; --m5:#A3459A;
  --ease:cubic-bezier(.2,.7,.2,1); --f:'Schibsted Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--m4);outline-offset:2px;border-radius:6px}
.st{max-width:1440px;margin:40px auto 12px;padding:0 24px;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.frame{max-width:1440px;margin:0 auto;padding:0 24px}
.panel{background:var(--surface);border-radius:20px;box-shadow:0 1px 2px rgba(16,19,23,.06),0 0 0 1px var(--line)}
.hdr{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.hdr h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.hdr h1 span{color:var(--ink-3);font-weight:500}
.pill{height:36px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px;transition:background .15s}
.pill:hover{background:var(--line)}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background .15s}
.ib:hover{background:var(--surface-2)}
.sp{flex:1}
.primary{height:40px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;transition:transform .15s var(--ease)}
.primary:active{transform:scale(.97)}
.lanes{display:grid;grid-template-columns:180px repeat(7,minmax(0,1fr))}
.lanes .dh{padding:12px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:13px;color:var(--ink-3);font-weight:600}
.lanes .dh b{display:block;font-size:24px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.lanes .dh.td{background:var(--ink);color:#B9C0C9}.lanes .dh.td b{color:#fff}
.who{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;position:relative}
.who::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.who .av{width:32px;height:32px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px}
.who small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.cell{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-height:84px;min-width:0;transition:background .15s;cursor:pointer}
.cell:hover{background:var(--surface-2)}
.cell.td{background:#F7F8FA}
.blk{border-radius:8px;padding:6px 8px;background:color-mix(in oklab,var(--c) 13%,#fff);color:color-mix(in oklab,var(--c) 70%,#000);font-size:12.5px;line-height:1.2;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:transform .15s var(--ease)}
.blk:hover{transform:translateY(-1px)}
.blk span{display:block;font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.blk.all{background:var(--c);color:#fff}
.blk.shared{box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--c) 40%,#fff)}
/* dialog */
.stage{border-radius:20px;background:rgba(16,19,23,.4);padding:48px 16px;display:grid;place-items:center}
.dialog{width:min(720px,100%);background:var(--surface);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1fr 240px;box-shadow:0 30px 80px -20px rgba(16,19,23,.45)}
.dmain{padding:24px;display:grid;gap:16px}
.dside{background:var(--surface-2);padding:24px;border-left:1px solid var(--line);display:grid;align-content:start;gap:10px}
.dside h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.f{display:grid;gap:6px}.f label{font-size:13px;font-weight:700;color:var(--ink-2)}
.in{height:44px;border-radius:10px;border:1.5px solid var(--line);padding:0 12px;font:inherit;width:100%;background:#fff}
.in:focus{outline:0;border-color:var(--ink)}
.r3{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px}
.mtog{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;border-radius:10px;font-weight:600;transition:background .15s}
.mtog:hover{background:#fff}
.mtog i{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--c);display:grid;place-items:center}
.mtog[aria-pressed=true] i{background:var(--c)}
.dft{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}
.btn{height:44px;padding:0 20px;border-radius:999px;font-weight:700}
.btn.s{background:var(--surface-2)}.btn.p{background:var(--ink);color:#fff}
/* family */
.fam{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:80px}
.load{padding:20px}
.load h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.lrow{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:12px;height:44px}
.track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--c);transform-origin:left;animation:grow .6s var(--ease) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.code{font-size:44px;font-weight:800;letter-spacing:.08em;margin:8px 0 16px}
.mob{display:none}
@media (max-width:1000px){.lanes{grid-template-columns:120px repeat(7,minmax(0,1fr))}.who small{display:none}.fam{grid-template-columns:1fr}}
@media (max-width:720px){
  .st,.frame{padding-left:16px;padding-right:16px}
  .lanes,.hdr .pill,.hdr .ib{display:none}
  .hdr{padding:16px}
  .hdr h1{font-size:24px}
  .primary span{display:none}.primary{width:44px;height:44px;padding:0;justify-content:center}
  .mob{display:block;padding:12px 16px 16px}
  .chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .chiprow button{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-weight:600;display:flex;align-items:center;gap:8px}
  .chiprow button i{width:10px;height:10px;border-radius:3px;background:var(--c)}
  .chiprow [aria-pressed=true]{background:var(--ink);color:#fff}
  .mday{margin-top:16px}
  .mday h3{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
  .mday h3 span{color:var(--ink-3);font-weight:500}
  .mev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px;border-radius:12px;background:var(--surface-2);margin-bottom:6px}
  .mev .tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
  .mev .bars{display:flex;gap:3px;margin-top:6px}.mev .bars i{height:4px;width:22px;border-radius:2px;background:var(--c)}
  .stage{padding:0;border-radius:0;background:none;margin:0 -16px}
  .dialog{grid-template-columns:1fr;border-radius:0;min-height:100svh;box-shadow:none}
  .dside{border-left:0;border-top:1px solid var(--line)}
  .r3{grid-template-columns:1fr 1fr}.r3 .f:first-child{grid-column:1/-1}
  .dft{position:sticky;bottom:0;background:#fff;flex-direction:column-reverse}.dft .btn{width:100%}
  .lrow{grid-template-columns:80px 1fr 28px}
  .code{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<p class="st">1 · Semana por pessoa</p>
<div class="frame"><div class="panel">
  <div class="hdr">
    <h1>15–21 <span>nov 2026</span></h1>
    <button class="ib" aria-label="Semana anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="ib" aria-label="Próxima semana"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="pill">Hoje</button>
    <span class="sp"></span>
    <button class="pill">Semana ▾</button>
    <button class="primary" aria-label="Novo evento"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Novo</span></button>
  </div>
  <div class="lanes" id="lanes"></div>
  <div class="mob"><div class="chiprow" id="chiprow"></div><div id="mlist"></div></div>
</div></div>

<p class="st">2 · Novo evento</p>
<div class="frame"><div class="stage">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Novo evento">
    <div class="dmain">
      <input class="in" style="height:auto;border:0;padding:0;font-size:26px;font-weight:800;letter-spacing:-.02em" value="Natação do Theo" aria-label="Título">
      <div class="r3"><div class="f"><label>Data</label><input class="in" value="17/11/2026"></div><div class="f"><label>Início</label><input class="in" value="17:00"></div><div class="f"><label>Fim</label><input class="in" value="18:00"></div></div>
      <div class="f"><label>Repetir</label><input class="in" value="Toda semana"></div>
      <div class="f"><label>Local</label><input class="in" value="Clube Pinheiros"></div>
      <div class="f"><label>Notas</label><input class="in" value="Levar touca nova"></div>
    </div>
    <aside class="dside"><h3>Faixa de quem</h3><div id="mt"></div></aside>
    <div class="dft"><button class="btn s">Cancelar</button><button class="btn p">Salvar</button></div>
  </div>
</div></div>

<p class="st">3 · Família</p>
<div class="frame fam">
  <section class="panel load"><h2>Semana de cada um</h2><div id="load"></div></section>
  <section class="panel load"><h2>Convidar para a família</h2><p style="color:var(--ink-2)">Código válido até alguém gerar outro.</p><div class="code">K7Q-42M</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn p">Copiar link</button><button class="btn s">Gerar novo</button></div></section>
</div>
<script src="data.js"></script>
<script>
const N=window.NINHO,$=s=>document.querySelector(s),col=id=>N.member(id).color;
const days=[15,16,17,18,19,20,21];
let h='<div class="dh" style="border-left:0"></div>'+days.map((d,i)=>`<div class="dh ${d===15?'td':''}">${N.weekdays[i]}<b>${d}</b></div>`).join('');
N.members.forEach((m,mi)=>{h+=`<div class="who" style="--c:${m.color}"><span class="av">${m.name[0]}</span><div>${m.name}<small>${mi<2?'adulto':mi<4?'criança':'avó'}</small></div></div>`;
  days.forEach(d=>{h+=`<div class="cell ${d===15?'td':''}">${N.byDay(d).filter(e=>e.who.includes(m.id)).map(e=>`<div class="blk ${e.allDay?'all':''} ${e.who.length>1?'shared':''}" style="--c:${m.color}">${e.title}${e.allDay?'':`<span>${e.t}</span>`}</div>`).join('')}</div>`})});
$('#lanes').innerHTML=h;
$('#chiprow').innerHTML='<button aria-pressed="true">Todos</button>'+N.members.map(m=>`<button aria-pressed="false" style="--c:${m.color}"><i></i>${m.name}</button>`).join('');
$('#mlist').innerHTML=days.slice(0,4).map((d,i)=>`<section class="mday"><h3>${i===0?'Hoje':i===1?'Amanhã':N.weekdaysLong[i]} <span>${d} nov</span></h3>${N.byDay(d).map(e=>`<div class="mev"><span class="tm">${e.allDay?'—':e.t}</span><div><b>${e.title}</b><div class="bars">${e.who.map(w=>`<i style="--c:${col(w)}"></i>`).join('')}</div></div></div>`).join('')}</section>`).join('');
$('#mt').innerHTML=N.members.map(m=>`<button class="mtog" style="--c:${m.color}" aria-pressed="${m.id==='theo'||m.id==='bruno'}"><i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><path d="m5 12 5 5L20 7"/></svg></i>${m.name}</button>`).join('');
const cnt=id=>N.events.filter(e=>e.who.includes(id)&&e.d>=15&&e.d<=21).length,mx=Math.max(...N.members.map(m=>cnt(m.id)));
$('#load').innerHTML=N.members.map(m=>`<div class="lrow"><b>${m.name}</b><div class="track"><i style="--c:${m.color};width:${cnt(m.id)/mx*100}%"></i></div><span style="text-align:right;font-weight:700">${cnt(m.id)}</span></div>`).join('');
</script>
</body>
</html>
