<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninho — Direção 1 · Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1E8; --surface:#FFFDF8; --surface-2:#EFE9DC; --line:#E2DACA; --ink:#1F1C17; --ink-2:#5E574B; --ink-3:#8C8473;
  --accent:#B9472A; --accent-ink:#fff; --focus:#1F1C17;
  --m1:#C4532D; --m2:#2F7A68; --m3:#B57D12; --m4:#3E63A8; --m5:#8C4479;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --sh-1:0 1px 0 rgba(31,28,23,.04),0 1px 3px rgba(31,28,23,.06);
  --sh-2:0 12px 40px -12px rgba(31,28,23,.22),0 2px 6px rgba(31,28,23,.06);
  --ease:cubic-bezier(.2,.7,.2,1);
  --display:'Bricolage Grotesque',sans-serif; --text:'Hanken Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.screen-title{max-width:1400px;margin:48px auto 12px;padding:0 24px;font:600 13px var(--text);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
/* shell */
.app{max-width:1400px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:268px 1fr;gap:24px}
.side{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:28px;padding-top:8px}
.brand{font:700 26px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:16px 0 0 var(--m2),8px -10px 0 var(--m3)}
.new{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;transition:transform .15s var(--ease),box-shadow .2s}
.new:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.new:active{transform:scale(.98)}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;box-shadow:var(--sh-1)}
.mini-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.mini-g span{height:28px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2)}
.mini-g .wd{color:var(--ink-3);font-size:11px;height:20px}
.mini-g .today{background:var(--accent);color:#fff;font-weight:600}
.mini-g .wk{background:var(--surface-2)}
.members{display:flex;flex-direction:column;gap:2px}
.mem{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:10px;transition:background .15s}
.mem:hover{background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.mem .chk{margin-left:auto;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff}
.mem[aria-pressed=false]{color:var(--ink-3)}
.mem[aria-pressed=false] .chk{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--line)}
/* main */
.main{min-width:0}
.bar{display:flex;align-items:center;gap:16px;height:72px}
.bar h1{font:700 40px/1 var(--display);letter-spacing:-.03em}
.bar h1 small{font-weight:500;color:var(--ink-3)}
.nav{display:flex;gap:4px;margin-left:8px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .15s}
.ib:hover{background:var(--surface-2)}
.seg{margin-left:auto;display:flex;background:var(--surface-2);padding:4px;border-radius:999px}
.seg button{height:34px;padding:0 16px;border-radius:999px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg [aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--sh-1)}
.mh{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.mh div{padding:10px 12px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(124px,1fr)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .15s;cursor:pointer}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:#FBF8F1}
.cell.out .n{color:var(--ink-3);opacity:.6}
.n{font:600 14px var(--text);width:28px;height:28px;display:grid;place-items:center;border-radius:50%;margin-bottom:2px}
.cell.today .n{background:var(--accent);color:#fff}
.ev{display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.2;padding:3px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;transition:background .15s}
.ev:hover{background:var(--surface-2)}
.ev .t{color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev.all{color:#fff;font-weight:600}
.ev .dots{display:flex;margin-left:auto;flex:none}
.ev .dots i{width:7px;height:7px;border-radius:50%;margin-left:-2px;box-shadow:0 0 0 1.5px var(--surface)}
.more{font-size:12px;color:var(--ink-3);padding:0 6px;font-weight:600}
/* mobile agenda */
.mobile{display:none}
/* dialog */
.dlg-wrap{max-width:1400px;margin:0 auto;padding:0 24px}
.stage{position:relative;border-radius:var(--r-l);background:linear-gradient(0deg,rgba(31,28,23,.35),rgba(31,28,23,.35)),repeating-linear-gradient(90deg,var(--surface) 0 120px,var(--surface-2) 120px 121px);min-height:640px;display:grid;place-items:center;padding:40px 16px;overflow:hidden}
.dialog{width:min(560px,100%);background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh-2);overflow:hidden;animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.dh{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.dh h2{font:700 22px var(--display);letter-spacing:-.01em}
.db{padding:20px 24px;display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font:inherit;color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px rgba(31,28,23,.08)}
.title-in{font:600 20px var(--display);height:52px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);font-weight:500;transition:all .15s}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.toggle{display:flex;align-items:center;justify-content:space-between;height:44px}
.sw{width:42px;height:26px;border-radius:999px;background:var(--ink);position:relative}
.sw::after{content:'';position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.df{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:var(--bg)}
.btn{height:44px;padding:0 20px;border-radius:999px;font-weight:600;transition:transform .15s var(--ease),background .15s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:#A33E24}
/* family */
.fam{max-width:1400px;margin:0 auto 80px;padding:0 24px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:24px;box-shadow:var(--sh-1)}
.card h2{font:700 24px var(--display);letter-spacing:-.01em;margin-bottom:16px}
.mrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 16px var(--display)}
.mrow .meta{flex:1;min-width:0}
.mrow .meta b{display:block;font-weight:600}
.mrow .meta span{font-size:13px;color:var(--ink-3)}
.code{font:700 40px/1 var(--display);letter-spacing:.12em;padding:20px;border-radius:var(--r-m);background:var(--bg);border:1px dashed var(--line);text-align:center;margin:12px 0 16px}
.stack{display:flex;gap:10px}
@media (max-width:1080px){.app{grid-template-columns:1fr}.side{display:none}.fam{grid-template-columns:1fr}}
@media (max-width:720px){
  .desk{display:none}
  .mobile{display:block;padding:0 16px}
  .screen-title{padding:0 16px;margin-top:32px}
  .m-top{display:flex;align-items:center;justify-content:space-between;height:60px}
  .m-top h1{font:700 30px/1 var(--display);letter-spacing:-.03em}
  .strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 16px}
  .strip button{height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--ink-3)}
  .strip b{font:600 17px var(--text);color:var(--ink)}
  .strip [aria-current]{background:var(--ink);color:var(--surface-2)}
  .strip [aria-current] b{color:#fff}
  .strip .pips{display:flex;gap:2px;height:4px}
  .strip .pips i{width:4px;height:4px;border-radius:50%}
  .day{margin-bottom:18px}
  .day h3{font:600 13px var(--text);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px 4px}
  .item{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;margin-bottom:8px;box-shadow:var(--sh-1);animation:in .35s var(--ease) backwards}
  .item:nth-child(2){animation-delay:.04s}.item:nth-child(3){animation-delay:.08s}
  .item .bar2{width:4px;border-radius:4px;flex:none}
  .item .tt{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-3);width:44px;flex:none;padding-top:1px}
  .item b{display:block;font-weight:600}
  .item .who{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .item .who span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);display:flex;align-items:center;gap:5px}
  .fab{position:sticky;bottom:16px;margin-left:auto;width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:var(--sh-2)}
  .dlg-wrap{padding:0}
  .stage{border-radius:0;padding:0;min-height:auto;display:block;background:none}
  .dialog{width:100%;border-radius:0;box-shadow:none;min-height:100svh;display:flex;flex-direction:column}
  .db{flex:1}
  .row{grid-template-columns:1fr 1fr}
  .row .field:first-child{grid-column:1/-1}
  .df{position:sticky;bottom:0;flex-direction:column-reverse}
  .df .btn{width:100%}
  .fam{padding:0 16px}
  .stack{flex-direction:column}
  .stack .btn{width:100%}
}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<p class="screen-title">1 · Mês</p>
<div class="app desk">
  <aside class="side">
    <div class="brand"><i></i><span style="margin-left:14px">ninho</span></div>
    <button class="new"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo evento</button>
    <div class="mini"><div class="mini-h"><span>Novembro</span><span class="label">2026</span></div><div class="mini-g" id="mini"></div></div>
    <div><p class="label" style="margin:0 10px 8px">Família Andrade</p><div class="members" id="mems"></div></div>
  </aside>
  <main class="main">
    <div class="bar">
      <h1>Novembro <small>2026</small></h1>
      <div class="nav">
        <button class="ib" aria-label="Mês anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="ib" aria-label="Próximo mês"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div class="seg" role="group" aria-label="Visualização"><button aria-pressed="true">Mês</button><button aria-pressed="false">Semana</button><button aria-pressed="false">Agenda</button></div>
    </div>
    <div class="month"><div class="mh label" id="mh"></div><div class="mg" id="grid"></div></div>
  </main>
</div>
<div class="mobile">
  <div class="m-top"><h1>Novembro</h1><button class="ib" aria-label="Filtrar membros"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button></div>
  <div class="strip" id="strip"></div>
  <div id="agenda"></div>
  <button class="fab" aria-label="Novo evento"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<p class="screen-title">2 · Novo evento</p>
<div class="dlg-wrap"><div class="stage">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div class="dh"><h2 id="dt">Novo evento</h2><button class="ib" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="db">
      <input class="input title-in" value="Natação do Theo" aria-label="Título">
      <div class="row">
        <div class="field"><label>Data</label><input class="input" value="17/11/2026"></div>
        <div class="field"><label>Início</label><input class="input" value="17:00"></div>
        <div class="field"><label>Fim</label><input class="input" value="18:00"></div>
      </div>
      <div class="field"><label>Quem vai</label><div class="chips" id="chips"></div></div>
      <div class="field"><label>Repetir</label><input class="input" value="Toda semana, às terças"></div>
      <div class="field"><label>Local</label><input class="input" placeholder="Clube Pinheiros" value="Clube Pinheiros"></div>
      <div class="toggle"><span>Lembrar 30 min antes</span><span class="sw" role="switch" aria-checked="true"></span></div>
    </div>
    <div class="df"><button class="btn sec">Cancelar</button><button class="btn pri">Salvar</button></div>
  </div>
</div></div>

<p class="screen-title">3 · Família</p>
<div class="fam">
  <section class="card"><h2>Família Andrade</h2><div id="famlist"></div></section>
  <section class="card"><h2>Convidar</h2><p style="color:var(--ink-2)">Quem entrar com o código vê e edita a agenda da família.</p><div class="code">K7Q-42M</div><div class="stack"><button class="btn pri">Copiar link</button><button class="btn sec">Gerar novo código</button></div></section>
</div>
<script src="data.js"></script>
<script>
const N=window.NINHO, $=s=>document.querySelector(s);
const col=id=>N.member(id).color;
$('#mh').innerHTML=N.weekdays.map(w=>`<div>${w}</div>`).join('');
let g='';
for(let i=0;i<35;i++){const d=i+1,out=d>30,dd=out?d-30:d,evs=out?[]:N.byDay(d);
  const shown=evs.slice(0,3).map(e=>e.allDay?`<div class="ev all" style="background:${col(e.who[0])}">${e.title}</div>`:`<div class="ev"><span class="t">${e.t}</span><span style="overflow:hidden;text-overflow:ellipsis">${e.title}</span><span class="dots">${e.who.map(w=>`<i style="background:${col(w)}"></i>`).join('')}</span></div>`).join('');
  g+=`<div class="cell ${out?'out':''} ${d===15?'today':''}"><span class="n">${dd}</span>${shown}${evs.length>3?`<span class="more">+${evs.length-3}</span>`:''}</div>`}
$('#grid').innerHTML=g;
$('#mini').innerHTML=['d','s','t','q','q','s','s'].map(w=>`<span class="wd">${w}</span>`).join('')+Array.from({length:30},(_,i)=>`<span class="${i+1===15?'today':i+1>15&&i+1<22?'wk':''}">${i+1}</span>`).join('');
$('#mems').innerHTML=N.members.map((m,i)=>`<button class="mem" aria-pressed="${i!==4}"><span class="dot" style="background:${m.color}"></span>${m.name}<span class="chk" style="background:${m.color}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="m5 12 5 5L20 7"/></svg></span></button>`).join('');
$('#chips').innerHTML=N.members.map(m=>`<button class="chip" aria-pressed="${m.id==='theo'||m.id==='bruno'}"><span class="dot" style="background:${m.color}"></span>${m.name}</button>`).join('');
$('#strip').innerHTML=[15,16,17,18,19,20,21].map((d,i)=>`<button ${d===15?'aria-current="date"':''}>${N.weekdays[i]}<b>${d}</b><span class="pips">${[...new Set(N.byDay(d).flatMap(e=>e.who))].slice(0,3).map(w=>`<i style="background:${col(w)}"></i>`).join('')}</span></button>`).join('');
$('#agenda').innerHTML=[15,16,17,18].map(d=>`<section class="day"><h3>${d===15?'Hoje':d===16?'Amanhã':N.weekdaysLong[(d-15)%7]+', '+d}</h3>${N.byDay(d).map(e=>`<div class="item"><span class="bar2" style="background:${col(e.who[0])}"></span><span class="tt">${e.allDay?'dia':e.t}</span><div><b>${e.title}</b><div class="who">${e.who.map(w=>`<span><i class="dot" style="background:${col(w)};width:7px;height:7px"></i>${N.member(w).name}</span>`).join('')}</div></div></div>`).join('')}</section>`).join('');
$('#famlist').innerHTML=N.members.map((m,i)=>`<div class="mrow"><span class="av" style="background:${m.color}">${m.name[0]}</span><div class="meta"><b>${m.name}</b><span>${i<2?'Administra':i<4?'Sem conta · perfil da criança':'Conta conectada'}</span></div><button class="ib" aria-label="Editar ${m.name}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg></button></div>`).join('');
</script>
</body>
</html>
